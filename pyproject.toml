[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtsp-supervisor"
version = "0.1.0"
description = "Resilient asyncio supervisor for RTSP and video streams with reconnect, stall detection and latest-frame delivery."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Robin" }]
keywords = ["rtsp", "asyncio", "video", "opencv", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
opencv = ["opencv-python-headless>=4.8"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "opencv-python-headless>=4.8",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rtsp_supervisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=rtsp_supervisor --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.mypy]
strict = true
files = ["src", "tests", "examples"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/fakes.py" = ["ASYNC110"]
